name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: apply + verify idempotency with production runner
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          node db/migrate.mjs
          node db/migrate.mjs | grep -q "migrations up to date"
      - name: verify tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          tables=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('sessions','inodes','blocks','operations','executions','jobs');")
          test "$tables" = "6"
      - name: verify append-only trigger
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          triggers=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'operations_append_only_%';")
          test "$triggers" -ge 3
      - name: verify append-only enforcement
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -q -tA -c "INSERT INTO public.sessions (name) VALUES ('ci-smoke');"
          op=$(psql "$DATABASE_URL" -q -tA -c "INSERT INTO public.operations (session_id, op_type, status) SELECT id, 'ci-smoke', 'ok' FROM public.sessions WHERE name = 'ci-smoke' LIMIT 1 RETURNING op_id;")
          out=$(psql "$DATABASE_URL" -tA -c "UPDATE public.operations SET status = 'done' WHERE op_id = '$op';" 2>&1 || true)
          printf '%s' "$out" | grep -q 'append-only' && echo "append-only enforced"
      - name: verify claim_job function
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -q -tA -c "INSERT INTO public.sessions (name) VALUES ('ci-worker-test');"
          psql "$DATABASE_URL" -q -tA -c "INSERT INTO public.jobs (session_id, kind, payload) SELECT id, 'exec', '{\"command\":\"echo ok\"}'::jsonb FROM public.sessions WHERE name = 'ci-worker-test' LIMIT 1 RETURNING job_id;" > /tmp/job_id.txt
          psql "$DATABASE_URL" -q -tA -c "SELECT * FROM claim_job('ci-runner');"
          psql "$DATABASE_URL" -q -tA -c "SELECT count(*) FROM jobs WHERE state = 'claimed' AND claimed_by = 'ci-runner';" | grep -q '1' && echo "claim_job works"
      - name: verify requeue_stale_jobs function
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -q -tA -c "UPDATE jobs SET state = 'claimed', claimed_by = 'stale-worker', updated_at = now() - interval '1 hour';"
          requeued=$(psql "$DATABASE_URL" -tA -c "SELECT requeue_stale_jobs(1000, 3);")
          test "$requeued" -ge 1 && echo "requeue_stale_jobs works (requeued $requeued)"
          psql "$DATABASE_URL" -q -tA -c "SELECT count(*) FROM jobs WHERE state = 'queued';" | grep -q '1' && echo "requeued job back to queued"